name: UrbanFlex 19 JPG once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urbanflex-19-jpg-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace UrbanFlex 19 image reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('product/urbanflex/index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/img/urbanflex/19.png'
          new = '/assets/img/items/urbanflex/19.jpg'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 occurrence, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/urbanflex-19-jpg-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use optimized JPG for UrbanFlex Rain Lock image'
          git push origin main
