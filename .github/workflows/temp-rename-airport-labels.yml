name: Temporary rename airport labels

on:
  push:
    paths:
      - '.github/workflows/temp-rename-airport-labels.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename airport exchange labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contents/overseas-business-trip-payment-exchange.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('空港両替・良い窓口') == 1
          assert s.count('空港両替・悪い窓口') == 1
          s = s.replace('空港両替・良い窓口', '空港両替・安い窓口')
          s = s.replace('空港両替・悪い窓口', '空港両替・高い窓口')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/overseas-business-trip-payment-exchange.html
          git diff --cached --quiet || git commit -m "Rename airport exchange rate labels"
          git push origin HEAD:main
