name: BSC20 fabric3 JPG once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bsc20-fabric3-jpg-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace BSC20 fabric3 image reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('product/bsc20/index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/img/items/bsc20/bsc20_fabric3.png'
          new = '/assets/img/items/bsc20/bsc20_fabric3.jpg'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 occurrence, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/bsc20-fabric3-jpg-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use optimized JPG for BSC20 fabric image'
          git push origin main
