          <h3 class="h4 mt-4">3．現地通貨を日本円に戻すなら、街中で済ませる</h3>
          <p>帰国時に現地通貨を日本円へ戻す場合、私は街中の両替所で済ませてから空港へ向かうことをおすすめします。</p>
          <p>空港まで行ってから日本円の在庫がないと言われる可能性もあります。</p>
          <p>レート差がほとんどないのであれば、そのリスクを取るメリットはないと思います。</p>
          <p>途中で現金が不足することもあるので、滞在中にレートの良い街中の両替所を一つ確認しておき、帰国時にもそこで日本円へ戻しておく。</p>
          <p>私はこれが一番確実だと思います。</p>

          <h3 class="h4 mt-4">4．Wiseの決済は強力</h3>
          <p>今回の調査で、<strong>Wiseの決済がとても頼りになる</strong>ことがよく分かりました。</p>
          <p>今はデビットカード決済が中心の国でも、QR決済は今後さらに各国で普及していくと思います。</p>
          <p>Wiseは、日本円を入れておけば、必ずしも渡航前に現地通貨へ両替しておく必要はありません。現地でカード決済をすると、必要に応じて自動的に現地通貨へ換算して支払うこともできます。</p>
          <p>もちろん、事前にVNDやTHBなどへ両替しておくこともできます。</p>
          <p>年会費もかからないので、海外出張へ行く機会がある方は、<strong>今のうちに使い始めてみるのもよいと思います。</strong></p>

          <h3 class="h4 mt-4">5．カード決済やATMでの現金引き出しでは、現地通貨を選ぶ</h3>
          <p>海外でカード決済をしたり、ATMから現金を引き出したりすると、<strong>「日本円（JPY）で支払いますか？」</strong>と表示されることがあります。</p>
          <p>日本円を選ぶと、店舗やATM側の為替レートで換算される場合があります。</p>
          <p><strong>基本的には、JPYではなく現地通貨を選びます。</strong></p>
          <p>これはWiseだけでなく、クレジットカードや他のデビットカードでも同じです。</p>
