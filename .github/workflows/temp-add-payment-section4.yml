name: Temporary add payment article section 4

on:
  push:
    paths:
      - '.github/workflows/temp-add-payment-section4.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add section 4
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('contents/overseas-business-trip-payment-exchange.html')
          src = page.read_text(encoding='utf-8')
          assert '4．その人に合った決済方法と両替方法' not in src
          marker = '    </article>\n  </main>'
          assert marker in src

          section = '''      <section class="section article-content-section">
        <div class="container container-narrow article-body">
          <h2 class="h3">4．その人に合った決済方法と両替方法</h2>

          <p>人によって、現地で使用する予定の金額は異なります。</p>
          <p>また、<strong>「現金を多く持たない安心に、いくらまでならコストを払えるか」</strong>という価値観も違うでしょう。</p>
          <p>初めて行く国では現地の状況が分からないので、どうしても少し保険をかけた考え方になると思います。</p>
          <p>今回、この資料を作ってみた私の意見としては、次のように考えます。</p>

          <h3 class="h4 mt-4">1．持ち込み・持ち出しの制限にかからない金額に留める</h3>
          <p>これは、本当に気をつけることをおすすめします。</p>
          <p>実際、帰国日にベトナムの空港で、検査に引っ掛かっている日本人を何度も目にしています。</p>
          <p>余談ですが、私も何度も検査官に声をかけられ、持っている現金を見せたことがあります。</p>
          <p>有名ブランドのバッグを持っていると、かなりの確率で検査官に声をかけられました。</p>
          <p>なお、私のブランド「ADDEVA」のバッグを持っていて、検査官に声をかけられたことはありません。苦笑。</p>
          <p>空港での手続き自体がそれほど難しくなくても、英語であれこれ聞かれ、それに対応するのは面倒です。</p>
          <p>しかも、その手続き中に、長いイミグレーションの列がどんどん伸びていくのを横目で見ていると、かなりストレスになります。</p>
          <p>必要な場合を除けば、<strong>最初から申告基準にかからない金額にしておくのが一番楽</strong>です。</p>
          <p>私は出発日と帰国日には、必ず財布の中の金額を確認しています。</p>

          <h3 class="h4 mt-4">2．ある程度の現地通貨は必要</h3>
          <p>仕事で行く場合、訪問先の方と食事に行く機会もあります。</p>
          <p>子会社や取引先のスタッフとの親睦会が開かれることもあるでしょう。</p>
          <p>そのとき、カードが使えないローカルのレストランに行くこともあります。</p>
          <p>また、ローカルフードを楽しめるようになってくると、出張でも旅は間違いなく楽しくなります。</p>
          <p>そのため、<strong>完全キャッシュレスを前提にせず、ある程度の現地通貨は持っておいた方が安心</strong>だと思います。</p>
          <p>ただし、WiseデビットやQR決済、ATMからの現金引き出しという予備手段もあります。</p>
          <p><strong>最初から使う予定額をすべて現金にする必要はありません。</strong></p>
          <p>特に次にいつ行くかわからない国では、現金を余らせれば日本円へ戻すときにもコストがかかります。</p>
          <p>必要と思う分だけ現金を用意し、足りない分をカードやQRで補うという考え方もよいと思います。</p>

          <h3 class="h4 mt-4">3．現地通貨を日本円に戻すなら、街中で済ませる</h3>
          <p>帰国時に現地通貨を日本円へ戻す場合、私は街中の両替所で済ませてから空港へ向かうことをおすすめします。</p>
          <p>空港まで行ってから日本円の在庫がないと言われる可能性もあります。</p>
          <p>レート差がほとんどないのであれば、そのリスクを取るメリットはないと思います。</p>
          <p>途中で現金が不足することもあるので、滞在中にレートの良い街中の両替所を一つ確認しておき、帰国時にもそこで日本円へ戻しておく。</p>
          <p>私はこれが一番確実だと思います。</p>

          <h3 class="h4 mt-4">4．Wiseの決済は強力</h3>
          <p>今回の調査で、<strong>Wiseの決済がとても頼りになる</strong>ことがよく分かりました。</p>
          <p>今はデビットカード決済が中心の国でも、QR決済は今後さらに各国で普及していくと思います。</p>
          <p>Wiseは、日本円を入れておけば、必ずしも渡航前に現地通貨へ両替しておく必要はありません。現地でカード決済をすると、必要に応じて自動的に現地通貨へ換算して支払うこともできます。</p>
          <p>もちろん、事前にVNDやTHBなどへ両替しておくこともできます。</p>
          <p>年会費もかからないので、海外出張へ行く機会がある方は、<strong>今のうちに使い始めてみるのもよいと思います。</strong></p>

          <h3 class="h4 mt-4">5．カード決済やATMでの現金引き出しでは、現地通貨を選ぶ</h3>
          <p>海外でカード決済をしたり、ATMから現金を引き出したりすると、<strong>「日本円（JPY）で支払いますか？」</strong>と表示されることがあります。</p>
          <p>日本円を選ぶと、店舗やATM側の為替レートで換算される場合があります。</p>
          <p><strong>基本的には、JPYではなく現地通貨を選びます。</strong></p>
          <p>これはWiseだけでなく、クレジットカードや他のデビットカードでも同じです。</p>
        </div>
      </section>

'''
          page.write_text(src.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-add-payment-section4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/overseas-business-trip-payment-exchange.html .github/workflows/temp-add-payment-section4.yml
          git commit -m "Add payment and exchange guidance section"
          git push origin HEAD:main
