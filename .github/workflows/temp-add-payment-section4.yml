name: Temporary add payment article section 4

on:
  push:
    paths:
      - '.github/workflows/temp-add-payment-section4.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add section 4
        env:
          SECTION_B64: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          page = Path('contents/overseas-business-trip-payment-exchange.html')
          src = page.read_text(encoding='utf-8')
          assert '4．その人に合った決済方法と両替方法' not in src
          marker = '    </article>\n  </main>'
          assert marker in src
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          page.write_text(src.replace(marker, section + marker, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-add-payment-section4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/overseas-business-trip-payment-exchange.html .github/workflows/temp-add-payment-section4.yml
          git commit -m "Add payment and exchange guidance section"
          git push origin HEAD:main
