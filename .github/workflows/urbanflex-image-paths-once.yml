name: One-shot UrbanFlex image path update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urbanflex-image-paths-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace UrbanFlex PNG references with uploaded JPGs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('product/urbanflex/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '/assets/img/urbanflex/16.png': '/assets/img/items/urbanflex/16.jpg',
              '/assets/img/items/urbanflex/uf_waterproof3.png': '/assets/img/items/urbanflex/uf_waterproof3.jpg',
              '/assets/img/urbanflex/20.png': '/assets/img/items/urbanflex/20.jpg',
              '/assets/img/items/urbanflex/3REX-40_layout.png': '/assets/img/items/urbanflex/3REX-40_layout.jpg',
              '/assets/img/urbanflex/18.png': '/assets/img/items/urbanflex/18.jpg',
              '/assets/img/items/urbanflex/2R-18_layout.png': '/assets/img/items/urbanflex/2R-18_layout.jpg',
              '/assets/img/urbanflex/UF_smart_pokets.png': '/assets/img/items/urbanflex/UF_smart_pokets.jpg',
              '/assets/img/urbanflex/14_2.png': '/assets/img/items/urbanflex/14_2.jpg',
              '/assets/img/urbanflex/15.png': '/assets/img/items/urbanflex/15.jpg',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of {old}, found {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit HTML update and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/urbanflex-image-paths-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize UrbanFlex image references'
          git push origin main
