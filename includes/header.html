<header class="site-header fixed-top">
  <style>
    .site-header .header-h1-slot:empty{display:none}

    .site-header.has-page-h1 .header-h1-slot{
      color:#555;
    }

    .site-header.has-page-h1 .header-h1-slot h1,
    .site-header.has-page-h1 .header-h1-slot .header-page-label{
      margin:0;
      font-size:.78rem;
      font-weight:500;
      line-height:1.25;
      letter-spacing:.02em;
      color:inherit;
    }

    @media (min-width: 992px){
      .site-header.has-page-h1 .navbar{
        padding-top:0;
        padding-bottom:0;
      }
      .site-header.has-page-h1 .navbar > .container{
        display:grid;
        grid-template-columns:auto minmax(0,1fr);
        grid-template-rows:auto auto;
        column-gap:1.5rem;
        align-items:center;
        min-height:76px;
        padding-top:4px;
        padding-bottom:4px;
      }
      .site-header.has-page-h1 .navbar-brand{
        grid-column:1;
        grid-row:1 / 3;
      }
      .site-header.has-page-h1 .header-h1-slot{
        display:block;
        grid-column:2;
        grid-row:1;
        justify-self:end;
        align-self:end;
        text-align:right;
      }
      .site-header.has-page-h1 .navbar-collapse{
        grid-column:2;
        grid-row:2;
        width:100%;
        align-self:start;
      }
      .site-header.has-page-h1 .navbar-nav{
        justify-content:flex-end;
      }
    }

    @media (max-width: 991.98px){
      .site-header.has-page-h1 .navbar{
        padding-top:0;
        padding-bottom:0;
      }
      .site-header.has-page-h1 .navbar > .container{
        display:grid;
        grid-template-columns:minmax(0,1fr) auto;
        grid-template-rows:auto auto auto;
        align-items:center;
      }
      .site-header.has-page-h1 .header-h1-slot{
        display:block;
        grid-column:1 / -1;
        grid-row:1;
        width:100vw;
        margin-left:calc(50% - 50vw);
        padding:3px 16px 4px;
        box-sizing:border-box;
        background:#2b2b2b;
        color:#f4f1e8;
        border-bottom:0;
        text-align:center;
      }
      .site-header.has-page-h1 .header-h1-slot #top-page-h1,
      .site-header.has-page-h1 .header-h1-slot .header-page-label{
        color:#f4f1e8;
        font-size:.70rem;
        font-weight:400;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .site-header.has-page-h1 .navbar-brand{
        grid-column:1;
        grid-row:2;
      }
      .site-header.has-page-h1 .navbar-toggler{
        grid-column:2;
        grid-row:2;
      }
      .site-header.has-page-h1 .navbar-collapse{
        grid-column:1 / -1;
        grid-row:3;
      }
    }
  </style>

  <nav class="navbar navbar-expand-lg navbar-dark">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/product/urbanflex/">ADDEVA UrbanFlex</a></li>
          <li class="nav-item"><a class="nav-link" href="/product/bsc20/">Beatas BSC-20</a></li>

          <!-- 購入者向けメニュー -->
          <li class="nav-item"><a class="nav-link" href="/customer.html?mode=login">ユーザーサポート</a></li>
          <li class="nav-item"><a class="nav-link" href="/development-program.html">商品開発参加プログラム</a></li>

          <li class="nav-item"><a class="nav-link" href="/company.html">会社情報</a></li>
          <li class="nav-item"><a class="nav-link" href="/faq.html">FAQ</a></li>

        </ul>
      </div>
    </div>
  </nav>
</header>
