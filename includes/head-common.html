<!-- Meta Pixel Code: GA4送信との競合切り分けのため、window.load後2秒で起動 -->
<script>
  (() => {
    const loadMetaPixel = () => {
      if (typeof window.fbq === 'function') return;

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '27594113103600058');
      fbq('track', 'PageView');
    };

    const scheduleMetaPixel = () => {
      window.setTimeout(loadMetaPixel, 2000);
    };

    if (document.readyState === 'complete') {
      scheduleMetaPixel();
    } else {
      window.addEventListener('load', scheduleMetaPixel, { once: true });
    }
  })();
</script>
<!-- End delayed Meta Pixel Code -->

<!-- 共通ヘッダー：ページタイトル表示と固定ヘッダー高さを同期 -->
<style>
  nav.subnav-shadow{
    top:var(--addeva-header-height, var(--header-desktop, 64px)) !important;
  }
</style>
<script>
  (() => {
    const normalizePath = (pathname) => {
      if (pathname === '/index.html') return '/';
      return pathname.replace(/\/index\.html$/, '/');
    };

    const path = normalizePath(location.pathname);

    /* TOPはindex.html側のH1をそのまま共通ヘッダーへ移動する既存処理を使用 */
    if (path === '/') return;

    const pageLabels = {
      '/company.html': '会社概要',
      '/support-guide.html': '製品保証・アフターサポート',
      '/quality-support.html': '品質・サポート',
      '/b2b.html': '法人向けバッグOEM・ODM',
      '/faq.html': 'よくあるご質問',
      '/contents/': 'CONTENTS',
      '/development-program.html': '商品開発参加プログラム',
      '/product/urbanflex/': 'ADDEVA UrbanFlex',
      '/product/urbanflex/pc_organizer.html': 'PCオーガナイザー',
      '/product/bsc20/': 'Beatas BSC-20',
      '/product/bsc20/yoko.html': 'BSC-20 横型（SS相当）',
      '/product/bsc20/ss.html': 'BSC-20 SS',
      '/product/bsc20/s.html': 'BSC-20 S',
      '/product/bsc20/m.html': 'BSC-20 M',
      '/contact.html': 'お問い合わせ',
      '/customer.html': 'ユーザーサポート',
      '/register.html': '製品登録',
      '/privacy-policy.html': 'プライバシーポリシー',
      '/terms.html': '利用規約'
    };

    const resolvePageLabel = () => {
      if (pageLabels[path]) return pageLabels[path];

      const h1 = document.querySelector('main h1');
      const h1Text = h1?.textContent?.replace(/\s+/g, ' ').trim();
      if (h1Text) return h1Text;

      const titleHead = document.title.split(/[｜|]/)[0]?.trim();
      return titleHead || '';
    };

    const mountPageLabel = () => {
      const header = document.querySelector('header.site-header');
      const slot = header?.querySelector('.header-h1-slot');
      if (!header || !slot) return false;
      if (slot.dataset.pageLabelMounted === '1') return true;

      const label = resolvePageLabel();
      if (!label) return false;

      const node = document.createElement('div');
      node.className = 'header-page-label';
      node.textContent = label;
      slot.appendChild(node);
      slot.dataset.pageLabelMounted = '1';
      header.classList.add('has-page-h1');

      const syncHeaderOffset = () => {
        const height = Math.ceil(header.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--addeva-header-height', `${height}px`);
        document.body.style.paddingTop = `calc(${height}px + env(safe-area-inset-top, 0px))`;
      };

      requestAnimationFrame(syncHeaderOffset);
      window.addEventListener('resize', syncHeaderOffset, { passive:true });
      return true;
    };

    const start = () => {
      if (mountPageLabel()) return;

      const observer = new MutationObserver(() => {
        if (mountPageLabel()) observer.disconnect();
      });
      observer.observe(document.documentElement, { childList:true, subtree:true });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start, { once:true });
    } else {
      start();
    }
  })();
</script>

<!-- UrbanFlexページ：ページ内インデックスとスマホ追従範囲を調整 -->
<style>
  @media (max-width: 991.98px) {
    nav.subnav-shadow.uf-subnav-ended {
      position: static !important;
    }
  }
</style>
<script>
  (() => {
    if (location.pathname !== '/product/urbanflex/' &&
        location.pathname !== '/product/urbanflex/index.html') return;

    /* UrbanFlexページ内のAmazon遷移をMeta Pixelへ送信 */
    document.addEventListener('click', (event) => {
      const target = event.target instanceof Element ? event.target : null;
      const link = target?.closest('a[href*="amazon.co.jp"]');
      if (!link) return;

      try {
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'urbanflex_amazon_click', {
            destination: 'amazon',
            product: 'urbanflex'
          });
        }
      } catch (error) {
        console.warn('GA4 event failed:', error);
      }

      if (typeof window.fbq === 'function') {
        window.fbq('trackCustom', 'AmazonOutboundClick');
      }
    });

    const setupUrbanFlexSubnav = () => {
      const heroCta = document.querySelector('.uf-hero .uf-sub .btn');
      if (heroCta) {
        heroCta.href = 'https://www.amazon.co.jp/dp/B0FS7F83QY';
        heroCta.target = '_blank';
        heroCta.rel = 'noopener';
      }

      const subnav = document.querySelector('nav.subnav-shadow');
      const nav = subnav?.querySelector('ul.nav');
      const common = document.querySelector('#common');
      if (!subnav || !nav) return;

      nav.innerHTML = `
        <li class="nav-item"><a class="nav-link px-2" href="#compare">比較表</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#options">オプション</a></li>
        <li class="nav-item"><a class="nav-link px-2" href="#faq">FAQ</a></li>
      `;

      if (!common) return;

      const updateStickyRange = () => {
        if (window.innerWidth > 991.98) {
          subnav.classList.remove('uf-subnav-ended');
          return;
        }

        const header = document.querySelector('header.site-header');
        const headerOffset = header ? Math.ceil(header.getBoundingClientRect().height) : 56;
        const commonTop = common.getBoundingClientRect().top;
        subnav.classList.toggle('uf-subnav-ended', commonTop <= headerOffset);
      };

      window.addEventListener('scroll', updateStickyRange, { passive: true });
      window.addEventListener('resize', updateStickyRange);
      updateStickyRange();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupUrbanFlexSubnav);
    } else {
      setupUrbanFlexSubnav();
    }
  })();
</script>

<!-- BSC-20サイズ別ページ：シリーズ共通情報をシリーズTOPから再利用 -->
<script>
  (() => {
    const sizePages = new Set([
      '/product/bsc20/ss.html',
      '/product/bsc20/yoko.html',
      '/product/bsc20/s.html',

    script.src = '/product/bsc20/bsc20-common.js?v=1';

    document.head.appendChild(script);

<!-- 読み物ページ：次の記事導線と下部ナビゲーションを統一 -->
<style>
  @media (max-width: 575.98px) {
    .article-next-link {
      display:block !important;
      width:100%;
    }
  }
</style>
<script>
  (() => {
    const setupArticleNavigation = () => {
      document.querySelectorAll('nav[aria-label="読み物コンテンツのナビゲーション"]').forEach((nav) => {
        const group = nav.querySelector('.d-flex');
        if (!group) return;

        const getLinks = () => [...group.querySelectorAll(':scope > a')];
        const getTopLink = (links) => links.find((a) => a.getAttribute('href') === '/contents/');
        const getListLink = (links) => links.find((a) => a.getAttribute('href') === '/contents/#column');

        const nextBlock = nav.previousElementSibling;
        const isNextBlock = nextBlock?.classList.contains('mt-4') &&
          nextBlock.querySelector(':scope > .small')?.textContent?.trim() === '次の記事';

        if (isNextBlock) {
          const links = getLinks();
          const topLink = getTopLink(links);
          const listLink = getListLink(links);
          const nextNavLink = [...links].reverse().find((a) =>
            a !== topLink && a !== listLink && a.textContent.trim().startsWith('次の記事：')
          );
          const nextArticleLink = nextBlock.querySelector('p a');

          if (nextArticleLink) {
            if (nextNavLink) nextArticleLink.textContent = nextNavLink.textContent.trim();
            nextArticleLink.classList.add('btn', 'btn-outline-dark', 'article-next-link', 'mb-2');
          }

          if (nextNavLink) nextNavLink.remove();
        }

        const links = getLinks();
        const topLink = getTopLink(links);
        const listLink = getListLink(links);
        const otherLinks = links.filter((a) => a !== topLink && a !== listLink);

        if (topLink) {
          topLink.classList.remove('btn-outline-secondary');
          topLink.classList.add('btn-outline-dark');
        }

        otherLinks.forEach((a) => group.appendChild(a));
        if (listLink) group.appendChild(listLink);
        if (topLink) group.appendChild(topLink);
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupArticleNavigation, { once:true });
    } else {
      setupArticleNavigation();
    }
  })();
</script>
